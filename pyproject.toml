[project]
name = "win-diag-agent"
version = "0.1.0"
description = "Lokalny agent AI (Strict Read-Only) do diagnostyki Windows z serwerem MCP i rygorystyczną anonimizacją"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0,<3",
    "openai>=1.55.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "psutil>=6.1.0",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "jinja2>=3.1.4",
    "pywin32>=308; sys_platform == 'win32'",
    "wmi>=1.5.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[project.scripts]
win-diag = "win_diag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/win_diag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"